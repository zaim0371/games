<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Clip</title>
<style>
:root{--bg:#f3f6f5;--sf:#fff;--tx:#14262b;--mu:#5d7278;--ac:#0e6b6b;--ac2:#f2b01e;--bd:#d3dedc;--bt:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a1d;--sf:#16272b;--tx:#e8f1ef;--mu:#8fa7ab;--ac:#4cc3bd;--bd:#2a4146;--bt:#062a2a}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
h1{font-size:1.9rem;line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:0 0 4px}
.sub,.hint{color:var(--mu)}.sub{margin:0 0 18px}.hint{font-size:.85rem;margin:8px 0 0}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--bt)}
button.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
video{width:100%;max-height:50vh;background:#000;border-radius:12px;display:block;margin:12px 0}
.card{background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--ac2);transition:width .25s}
.pl{display:none;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:.85rem;color:var(--mu)}.pl b{font-size:1.15rem;color:var(--tx);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:8px 0 0;padding:0;font-size:.82rem;color:var(--mu);display:none}
.steps li{display:flex;gap:8px;padding:2px 0}.steps li.sub{padding-left:22px}.steps li.on{color:var(--tx)}.steps li.er{color:#c0392b}
.steps .s{width:14px;text-align:center;flex:none}.steps .n{flex:1;min-width:0}.steps .pc{font-variant-numeric:tabular-nums}
.msg{min-height:1.3em;margin:8px 0 0;font-size:.9rem;color:var(--mu)}.msg.e{color:#c0392b}
summary{cursor:pointer;font-weight:700}
.out video{max-height:40vh}
</style>
</head>
<body>
<main>
<h1>Auto Clip</h1>
<p class="sub">Unggah video, AI mencari poin pentingnya, lalu kamu tonton, potong, dan bagikan ke TikTok.</p>


<section class="card">
  <label for="gk">Gemini API key</label><input id="gk" type="password" autocomplete="off" placeholder="AIza...">
  <p class="hint">Isi sekali saja. Tersimpan hanya di browser ini, tidak dikirim ke server lain. Buat di aistudio.google.com/apikey</p>
</section>

<input id="f" type="file" accept="video/*" aria-label="Pilih video">
<video id="v" controls playsinline hidden></video>

<section class="card" id="opt" hidden>
  <div class="g2">
    <div><label for="n">Jumlah klip</label><select id="n"><option>3</option><option selected>5</option><option>8</option></select></div>
    <div><label for="st">Cari yang</label><select id="st"><option value="penting">Poin penting</option><option value="menarik">Momen menarik</option></select></div>
    <div><label for="mn">Durasi minimal (detik)</label><input id="mn" type="number" min="5" value="20" inputmode="numeric"></div>
    <div><label for="mx">Durasi maksimal (detik)</label><input id="mx" type="number" min="10" value="60" inputmode="numeric"></div>
    <div><label for="lg">Bahasa video</label><select id="lg"><option value="">Otomatis</option><option value="id">Indonesia</option><option value="en">Inggris</option></select></div>
  </div>
  <button id="go">Cari poin penting</button>
  <button id="rt" class="g" hidden style="margin-left:8px"></button>
  <div class="bar" id="bar"><i id="pg"></i></div>
  <div class="pl" id="pl" aria-hidden="true"><b id="pn">0%</b><span id="el"></span></div>
  <p class="msg" id="msg" role="status"></p>
  <ul class="steps" id="steps" aria-hidden="true"></ul>
</section>

<div id="list"></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)},v=$("v"),dur=0,src=null,busy=false,stopAt=null;
var MODELS=["gemini-3.6-flash","gemini-3.5-flash","gemini-3.5-flash-lite"],KEY="autoclip:gk",TR=["gemini-3.5-flash-lite","gemini-3.5-flash","gemini-3.6-flash"],THINK=[{thinkingLevel:"minimal"},{thinkingBudget:0},null];
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
try{$("gk").value=localStorage.getItem(KEY)||""}catch(e){}
$("gk").oninput=function(){try{localStorage.setItem(KEY,$("gk").value.trim())}catch(e){}};
function fmt(n){n=Math.max(0,Math.round(n));var h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
function msg(t,e){$("msg").textContent=t||"";$("msg").className="msg"+(e?" e":"")}
function toSec(v){if(typeof v==="number")return v;var p=String(v==null?"":v).trim().split(":").map(Number);if(!p.length||p.some(function(x){return !isFinite(x)}))return NaN;return p.reduce(function(a,x){return a*60+x},0)}
function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.onerror=function(){rej(new Error("Gagal membaca audio."))};r.readAsDataURL(blob)})}
function post(url,key,body,onUp,ms){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();x.open("POST",url);x.timeout=ms||90000;
    x.setRequestHeader("x-goog-api-key",key);x.setRequestHeader("content-type","application/json");
    if(onUp){x.upload.onprogress=function(e){if(e.lengthComputable)onUp(e.loaded/e.total)};x.upload.onload=function(){onUp(1)}}
    x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(e){}res({ok:x.status>=200&&x.status<300,status:x.status,j:j})};
    x.ontimeout=function(){res({ok:false,status:0,timeout:true,j:{}})};
    x.onerror=function(){rej(new Error("net"))};
    x.send(body);
  });
}
async function gem(parts,schema,ui,opt){
  ui=ui||{};opt=opt||{};
  var key=$("gk").value.trim();if(!key)throw new Error("Isi Gemini API key dulu di bagian atas.");
  var models=opt.models||MODELS,ti=0;
  function build(){var g={responseMimeType:"application/json",responseSchema:schema,temperature:0.2,maxOutputTokens:opt.max||8192};if(THINK[ti])g.thinkingConfig=THINK[ti];return JSON.stringify({contents:[{role:"user",parts:parts}],generationConfig:g})}
  var body=build(),d=null,lastMsg="",busy=false,slow=false;
  for(var mi=0;mi<models.length&&!d;mi++){
    for(var t=0;t<2&&!d;t++){
      if(ui.start)ui.start();
      var r;
      try{r=await post("https://generativelanguage.googleapis.com/v1beta/models/"+models[mi]+":generateContent",key,body,ui.up,opt.timeout)}
      catch(e){throw new Error("Tidak bisa terhubung ke Gemini. Cek koneksi internetmu.")}
      if(r.timeout){slow=true;lastMsg="timeout";if(ui.retry)ui.retry("Terlalu lama, mencoba model lain…");break}
      var j=r.j;
      if(r.ok){d=j;break}
      lastMsg=(j.error&&j.error.message)||("Gemini error "+r.status);
      if(r.status===400&&/api key/i.test(lastMsg))throw new Error("Gemini API key tidak valid. Periksa lagi key-nya.");
      if(r.status===400&&ti<THINK.length-1){ti++;body=build();t--;continue}
      if(r.status===401||r.status===403)throw new Error("Gemini API key ditolak. Pastikan key-nya aktif.");
      if(r.status===429||r.status>=500){busy=true;if(t===0){if(ui.retry)ui.retry("Gemini sibuk, mencoba lagi…");await sleep(3000)}continue}
      if(r.status===404)break;
      throw new Error(lastMsg);
    }
  }
  if(!d)throw new Error(busy?"Gemini sedang terlalu sibuk atau kuotanya habis. Tunggu beberapa menit lalu coba lagi.":slow?"Gemini terlalu lama merespons. Coba lagi sebentar lagi.":lastMsg);
  var c=d.candidates&&d.candidates[0],tx=((c&&c.content&&c.content.parts)||[]).map(function(p){return p.text||""}).join("");
  if(!tx)throw new Error("Gemini tidak memberi jawaban. Coba lagi.");
  var cl=tx.replace(/```json|```/g,"").trim();
  try{return JSON.parse(cl)}catch(e){
    var k=cl.lastIndexOf("}");
    if(k>0){try{return JSON.parse(cl.slice(0,k+1)+"]}")}catch(e2){}}
    throw new Error("Jawaban AI tidak terbaca. Coba lagi.");
  }
}
async function api(action,body){
  if(action==="transcribe"){
    var file=body.file,lang=body.language;
    var hint=lang==="id"?"Bahasa ucapan: Indonesia. ":lang==="en"?"Bahasa ucapan: Inggris. ":"";
    var prompt=hint+"Audio ini potongan dari rekaman yang lebih panjang, jadi bisa dimulai atau berakhir di tengah kalimat. Transkripsikan semua ucapan pada audio ini dalam bahasa aslinya. Bagi menjadi segmen pendek per kalimat atau gagasan (sekitar 3 sampai 15 detik). Untuk tiap segmen beri \"start\" dan \"end\" dalam format MM:SS (menit:detik dari awal audio) dan \"text\". Jangan menerjemahkan dan jangan mengarang. Jika audio berupa lagu atau ada bagian yang berulang, tulis tiap segmen satu kali sesuai waktunya, jangan mengulang tanpa henti, dan lewati bagian musik tanpa suara. Jika tidak ada ucapan, kembalikan daftar kosong.";
    var schema={type:"OBJECT",properties:{segments:{type:"ARRAY",items:{type:"OBJECT",properties:{start:{type:"STRING"},end:{type:"STRING"},text:{type:"STRING"}},required:["start","end","text"]}}},required:["segments"]};
    var out=await gem([{text:prompt},{inline_data:{mime_type:"audio/wav",data:await b64(file)}}],schema,body.ui,{models:TR,max:8192,timeout:75000});
    return {segments:(out.segments||[]).map(function(x){return{start:toSec(x.start),end:toSec(x.end),text:String(x.text||"").trim()}}).filter(function(x){return isFinite(x.start)&&isFinite(x.end)&&x.end>=x.start&&x.text})};
  }
  var LEAD=1,segs=body.segments,count=body.count||5,minSec=body.minSec||20,maxSec=body.maxSec||60,style=body.style,duration=body.duration||0;
  if(!segs||!segs.length)throw new Error("Transkrip kosong. Tidak ada ucapan yang terdeteksi.");
  var tr=segs.map(function(x){return"["+Math.round(x.start)+"-"+Math.round(x.end)+"] "+x.text}).join("\n");
  var goal=style==="menarik"?"momen paling menarik, lucu, mengejutkan, atau emosional yang cocok jadi video pendek TikTok":"poin-poin paling penting dan paling berisi informasi";
  var p2="Kamu editor video. Dari transkrip berstempel waktu (detik), pilih bagian untuk dipotong jadi klip pendek. start dan end dalam detik (angka), mengikuti batas kalimat pada transkrip. Klip tidak boleh saling tumpang tindih. title maksimal 8 kata, reason satu kalimat singkat, keduanya dalam bahasa yang sama dengan transkrip.\n\nPilih maksimal "+count+" klip berisi "+goal+". Durasi tiap klip antara "+minSec+" dan "+maxSec+" detik. Mulai klip di awal gagasan dan akhiri setelah gagasan selesai.\n\nTranskrip:\n"+tr;
  var sc2={type:"OBJECT",properties:{clips:{type:"ARRAY",items:{type:"OBJECT",properties:{start:{type:"NUMBER"},end:{type:"NUMBER"},title:{type:"STRING"},reason:{type:"STRING"}},required:["start","end","title","reason"]}}},required:["clips"]};
  var res=await gem([{text:p2}],sc2,body.ui,{timeout:120000}),mx=Number(duration)||Infinity;
  var clips=(res.clips||[]).map(function(c){return{start:Math.max(0,Number(c.start)-LEAD),end:Math.min(mx,Number(c.end)),title:String(c.title||"Klip"),reason:String(c.reason||"")}}).filter(function(c){return isFinite(c.start)&&isFinite(c.end)&&c.end-c.start>=3}).sort(function(a,b){return a.start-b.start}).slice(0,count);
  return {clips:clips};
}
function wav(f,sr){var n=f.length,b=new ArrayBuffer(44+n*2),d=new DataView(b);
  function w(o,t){for(var i=0;i<t.length;i++)d.setUint8(o+i,t.charCodeAt(i))}
  w(0,"RIFF");d.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*2,true);
  new Int16Array(b,44,n).set(f);
  return new Blob([b],{type:"audio/wav"});}
var steps=[],t0=0,raf=0,tick=0,lastPc=0;
function addStep(label,w,note){var s={label:label,w:w,p:0,note:note||"",st:"",sub:false};steps.push(s);return s}
function fin(s,note){s.p=1;s.st="";if(note!==undefined)s.note=note}
function overall(){var a=0;steps.forEach(function(s){if(!s.sub)a+=s.w*s.p});return a}
function draw(){
  if(raf)return;
  raf=requestAnimationFrame(function(){
    raf=0;var pc=Math.max(lastPc,Math.min(100,Math.floor(overall()*100+1e-6)));lastPc=pc;
    $("pg").style.width=pc+"%";$("pn").textContent=pc+"%";$("el").textContent="Berjalan "+fmt((Date.now()-t0)/1000);
    $("steps").innerHTML=steps.map(function(s){
      var ic=s.st==="er"?"✕":s.p>=1?"✓":s.st==="on"?"▸":"○";
      return '<li class="'+(s.sub?"sub ":"")+s.st+'"><span class="s">'+ic+'</span><span class="n">'+s.label+(s.note?" · "+s.note:"")+'</span><span class="pc">'+Math.floor(s.p*100)+"%</span></li>";
    }).join("");
  });
}
function begin(){steps=[];lastPc=0;t0=Date.now();$("bar").style.display="block";$("pl").style.display="flex";$("steps").style.display="block";$("pg").style.width="0";clearInterval(tick);tick=setInterval(draw,500)}
function finish(ok){clearInterval(tick);draw();if(ok)setTimeout(function(){if(!busy){$("bar").style.display="none";$("pl").style.display="none";$("steps").style.display="none"}},1500)}
function creep(s,lo,hi,tau){var a=Date.now();s.st="on";var iv=setInterval(function(){s.p=Math.max(s.p,lo+(hi-lo)*(1-Math.exp(-(Date.now()-a)/tau)));draw()},250);return function(){clearInterval(iv)}}
function readBuf(file,onp){return new Promise(function(res,rej){var r=new FileReader();r.onprogress=function(e){if(e.lengthComputable)onp(e.loaded/e.total)};r.onload=function(){res(r.result)};r.onerror=function(){rej(new Error("Gagal membaca file video."))};r.readAsArrayBuffer(file)})}
var ASR=12000;
async function prepAudio(file,s1,s2,s3){
  s1.st="on";var buf=await readBuf(file,function(f){s1.p=f;draw()});fin(s1,"");
  var AC=window.AudioContext||window.webkitAudioContext,ac;
  try{ac=new AC({sampleRate:ASR})}catch(e){ac=new AC()}
  var mb=file.size/1048576,dec,stop=creep(s2,0,.95,Math.max(1500,mb*40));
  try{dec=await ac.decodeAudioData(buf)}catch(e){stop();ac.close();throw new Error("Audio pada video ini tidak bisa dibaca browser.")}
  buf=null;stop();ac.close();fin(s2,"");
  if(dec.sampleRate!==ASR){
    var off=new OfflineAudioContext(dec.numberOfChannels,Math.ceil(dec.duration*ASR),ASR),bs=off.createBufferSource();
    bs.buffer=dec;bs.connect(off.destination);bs.start();
    stop=creep(s3,0,.95,Math.max(800,dec.duration*8));
    dec=await off.startRendering();stop();
  }
  var ch=dec.numberOfChannels,n=dec.length,out=new Int16Array(n),chs=[],c,i,x;
  for(c=0;c<ch;c++)chs.push(dec.getChannelData(c));
  for(i=0;i<n;i++){
    x=0;for(c=0;c<ch;c++)x+=chs[c][i];x/=ch;
    x=x<-1?-1:x>1?1:x;out[i]=x<0?x*32768:x*32767;
  }
  fin(s3,"");
  return out;
}
$("f").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  if(src)URL.revokeObjectURL(src);
  src=URL.createObjectURL(f);v.src=src;v.hidden=false;$("list").innerHTML="";msg("");
  v.onloadedmetadata=function(){dur=v.duration||0;$("opt").hidden=false;msg("Panjang video "+fmt(dur)+".")};
  v.onerror=function(){msg("Video ini tidak bisa dibuka di browser.",true)};
};
v.addEventListener("timeupdate",function(){if(stopAt!==null&&v.currentTime>=stopAt){v.pause();stopAt=null}});
var job=null,rt=$("rt");
function showRetry(label,fn){rt.textContent=label;rt.hidden=false;rt.onclick=function(){if(busy)return;rt.hidden=true;fn()}}
function isFatal(e){return /API key|Isi Gemini/i.test((e&&e.message)||"")}
function updT(){var J=job,a=0,dn=0;J.subs.forEach(function(c){a+=c.p;if(c.p>=1)dn++});J.sT.p=a/J.n;J.sT.note=dn+" dari "+J.n+" bagian selesai"}
async function runParts(idx){
  var J=job,next=0,stopAll=false,SR=J.SR,pcm=J.pcm;
  var one=async function(i){
    var c=J.subs[i],waiting=false,iv=0,ta=0,tau=Math.max(4000,J.CH*90);
    function stop(){clearInterval(iv);iv=0}
    c.st="on";c.p=.02;c.note="menyiapkan audio…";updT();draw();
    var ui={
      start:function(){stop();waiting=false;c.note="mengunggah audio…";draw()},
      up:function(f){
        c.p=Math.max(c.p,.05+.4*f);
        if(f>=1&&!waiting){waiting=true;ta=Date.now();c.note="AI menyalin ucapan…";iv=setInterval(function(){c.p=Math.max(c.p,.45+.52*(1-Math.exp(-(Date.now()-ta)/tau)));c.note="AI menyalin ucapan… "+fmt((Date.now()-ta)/1000);updT();draw()},500)}
        else if(!waiting)c.note="mengunggah audio "+Math.round(f*100)+"%";
        updT();draw();
      },
      retry:function(m){stop();waiting=false;c.note=m;draw()}
    };
    var cs=i*J.CH,ce=(i+1)*J.CH,from=Math.max(0,Math.floor((cs-J.OV)*SR)),to=Math.min(pcm.length,Math.ceil((ce+J.OV)*SR)),lead=from/SR;
    var blob=wav(pcm.subarray(from,to),SR),d;
    try{d=await api("transcribe",{file:blob,language:$("lg").value,ui:ui})}catch(e){stop();c.st="er";c.note="gagal, bisa diulang";draw();throw e}
    stop();
    J.res[i]=d.segments.map(function(x){return{start:x.start+lead,end:x.end+lead,text:x.text}}).filter(function(x){return x.start>=cs-0.5&&(i===J.n-1||x.start<ce-0.5)});
    fin(c,J.res[i].length+" segmen");updT();draw();
  };
  var worker=async function(){while(!stopAll){var k=next++;if(k>=idx.length)return;try{await one(idx[k])}catch(e){if(isFatal(e)){J.fatal=e;stopAll=true}}}};
  var ws=[];for(var w=0;w<Math.min(J.PAR,idx.length);w++)ws.push(worker());
  await Promise.all(ws);
}
function idle(ok){busy=false;$("go").disabled=false;finish(ok)}
async function stageT(idx){
  var J=job;busy=true;$("go").disabled=true;rt.hidden=true;J.fatal=null;
  J.sT.st="on";clearInterval(tick);tick=setInterval(draw,500);
  msg("Menyalin ucapan jadi teks (maks. "+Math.min(J.PAR,idx.length)+" bagian bersamaan)…");draw();
  await runParts(idx);
  var bad=[];for(var i=0;i<J.n;i++)if(!J.res[i])bad.push(i);
  if(bad.length){
    J.sT.st="er";J.PAR=Math.max(2,Math.floor(J.PAR/2));
    msg(J.fatal?J.fatal.message:bad.length+" dari "+J.n+" bagian gagal (biasanya Gemini sedang sibuk atau kuota habis). Bagian lain sudah aman, tinggal ulangi yang gagal.",true);
    idle(false);
    showRetry("Ulangi "+bad.length+" bagian yang gagal",function(){
      bad.forEach(function(i){var c=J.subs[i];c.p=0;c.st="";c.note="menunggu"});
      J.sT.st="on";stageT(bad);
    });
    return;
  }
  await stageH();
}
async function stageH(){
  var J=job;busy=true;$("go").disabled=true;rt.hidden=true;
  clearInterval(tick);tick=setInterval(draw,500);
  var segs=[].concat.apply([],J.res);fin(J.sT,segs.length+" segmen teks");
  J.sH.p=0;J.sH.st="";
  msg("AI memilih poin penting…");J.sH.note="AI membaca transkrip…";var stopH=creep(J.sH,0,.95,8000),r;
  try{r=await api("highlights",{segments:segs,count:+$("n").value,minSec:J.mn,maxSec:J.mx,style:$("st").value,duration:dur,ui:{retry:function(m){J.sH.note=m;draw()}}})}
  catch(e){stopH();J.sH.st="er";msg(e.message||"Gagal memilih poin penting.",true);idle(false);showRetry("Ulangi cari poin penting",stageH);return}
  stopH();fin(J.sH,r.clips.length+" klip");
  if(!r.clips.length)msg("AI tidak menemukan klip yang cocok. Coba ubah durasi atau gaya.",true);
  else{$("list").innerHTML="";msg("Ditemukan "+r.clips.length+" klip. Tonton dulu, atur waktunya bila perlu, lalu potong.");r.clips.forEach(card)}
